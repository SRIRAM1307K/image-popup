<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Image Gallery</h1>
      <div class="images-container">
        <img id="img1" src="https://picsum.photos/id/13/200/300" alt="image" />
        <img id="img2" src="https://picsum.photos/id/7/200/300" alt="image" />
        <img id="img3" src="https://picsum.photos/id/6/200/300" alt="image" />
      </div>

      <div class="popup" id="popup">
        <span class="close" id="close">&times;</span>
        <img id="popup-img" src="" alt="" />
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
